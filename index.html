<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP to Becca & Caleb's Open House</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="survey-container">
        <header class="survey-header">
            <h1>RSVP to Becca and Caleb's Open House</h1>
            <p><strong>July 18th</strong></p>
        </header>

        <form id="survey-form">
            <div class="question-card">
                <h3 class="question-title">We are excited to celebrate with you!</h3>
                <p class="subtitle">Please enter your name below to RSVP.</p>
                
                <input type="text" name="guest_name" class="free-response-input" placeholder="Jane Doe" required>
                
                <!-- Hidden variables for compatibility with current spreadsheet structure -->
                <input type="hidden" name="showing_up" value="yes">
                <input type="hidden" name="rsvp" value="yes">
            </div>

            <!-- Action Buttons/Links -->
            <div class="submit-container">
                <a href="https://www.amazon.com/wedding/share/caleblovesbecca" target="_blank" class="registry-link">View Registry</a>
                <button type="submit" class="submit-btn color-4">RSVP</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
